format = """
[](#81A1C1)\
$os\
$username\
[](bg:#3B4252 fg:#81A1C1)\
$directory\
[](fg:#3B4252 bg:#434C5E)\
$git_branch\
$git_status\
[](fg:#434C5E bg:#4C566A)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:#4C566A bg:#81A1C1)\
$docker_context\
[](fg:#81A1C1 bg:#5E81AC)\
$time\
[ ](fg:#5E81AC)\
$line_break\
[❯❯❯ ](fg:#81A1C1)
"""

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#81A1C1"
style_root = "bg:#81A1C1"
format = '[$user ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#2E3440"
disabled = true # Disabled by default

[directory]
style = "bg:#3B4252"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#81A1C1"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#434C5E"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#434C5E"
format = '[$all_status$ahead_behind ]($style)'
conflicted = ' '
ahead = ' '
behind = ' '
diverged = ' '
up_to_date = ''
untracked = ' '
stashed = '󰏗 '
modified = ' '
staged = ' '
renamed = '󰑕 '
deleted = '󰆴 '

[golang]
symbol = " "
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#4C566A"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#5E81AC"
format = '[ $time ]($style)'

[line_break]
disabled = false

